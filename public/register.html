7<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Apex Ventures</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1a2e22 0%, #0d1b1e 40%, #080d1a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 450px;
      text-align: center;
      margin-top: 1rem;
    }

    .badge {
      display: inline-block;
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #facc15, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      margin: 1.5rem 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
      margin-bottom: 1.1rem;
    }

    label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .input-wrapper {
      display: flex;
      gap: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
    }

    /* Dedicated OTP Input Bar */
    .otp-input-bar {
      letter-spacing: 6px;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      color: #facc15;
      border-color: #10b981;
      background-color: rgba(16, 185, 129, 0.08);
    }

    .btn-verify {
      padding: 0 1rem;
      background: #334155;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-verify:hover {
      background: #0284c7;
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 1.05rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #059669 0%, #10b981 50%, #d97706 100%);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
      filter: brightness(1.08);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #334155;
    }

    .divider span {
      padding: 0 0.75rem;
    }

    /* Social Logins */
    .oauth-container {
      display: flex;
      gap: 0.75rem;
    }

    .btn-oauth {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-oauth:hover {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.8);
    }

    .alert {
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
      margin-bottom: 1rem;
      text-align: center;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .alert-success {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    footer {
      text-align: center;
      font-size: 0.95rem;
      color: #64748b;
    }

    footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">💰 Create Account</div>
    <h1>Apex Ventures</h1>
    <p class="subtitle">Join the money pot to start investing and earning.</p>
  </header>

  <main>
    <div id="alertBox" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. " required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@gmail.com" required />
      </div>

      <!-- Phone Number Input -->
      <div class="form-group">
        <label for="phone">Phone Number (Twilio SMS)</label>
        <div class="input-wrapper">
          <input type="tel" id="phone" placeholder="+254 7XX XXX XXX" required />
      </div>
      </div>

      <!-- Dedicated OTP Bar -->
      <div class="form-group">
        <label for="otp">SMS Verification Code (OTP)</label>
        <input 
          type="text" 
          id="otp" 
          class="otp-input-bar" 
          placeholder="••••••" 
          maxlength="6" 
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="one-time-code"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit">Register Account 🚀</button>
    </form>

    <div class="divider">
      <span>OR REGISTER WITH</span>
    </div>

    <!-- OAuth Logins: Google & Apple (iOS) -->
    <div class="oauth-container">
      <a href="/api/auth/google" class="btn-oauth">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#ea4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
          <path fill="#4285f4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
          <path fill="#fbbc05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.6-.8-1-1.8-1-2.9z"/>
          <path fill="#34a853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
        </svg>
        Google
      </a>

      <a href="/api/auth/apple" class="btn-oauth">
        <svg width="18" height="18" viewBox="0 0 170 170" fill="#ffffff">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.01.24-9.87-1.78-14.58-6.04-3.13-2.75-7.01-7.42-11.64-14.03-5.83-8.33-10.45-17.65-13.88-27.97-3.42-10.31-5.13-20.35-5.13-30.12 0-14.58 3.75-26.6 11.26-36.08 7.51-9.47 16.99-14.28 28.45-14.42 4.67 0 9.87 1.15 15.61 3.44 5.73 2.29 9.69 3.44 11.87 3.44 1.94 0 6.01-1.22 12.22-3.66 6.21-2.44 11.45-3.53 15.72-3.27 12.56.85 22.38 5.61 29.47 14.28-11.06 6.72-16.48 16.14-16.27 28.26.24 9.61 4.01 17.58 11.33 23.91 4.54 3.93 9.81 6.8 15.82 8.62-1.39 4.15-3.09 8.52-5.1 13.11zM119.22 31.09c0-7.08 2.58-13.82 7.74-20.21 5.17-6.39 11.65-10.27 19.45-11.64.24 1.21.36 2.29.36 3.26 0 7.08-2.67 13.93-8.01 20.55-5.33 6.62-11.84 10.42-19.54 11.41-.12-.85-.18-2.02-.18-3.37z"/>
        </svg>
        iOS / Apple
      </a>
    </div>

    <p style="text-align: center; margin-top: 1.5rem; color: #94a3b8; font-size: 0.9rem;">
      Already registered? <a href="/login.html" style="color: #10b981; font-weight: 600;">Login here</a>
    </p>
  </main>

  <footer>
    <p>Contact us: <a href="mailto:venture@gmail.com">venture@gmail.com</a></p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('registerForm');
      const sendOtpBtn = document.getElementById('sendOtpBtn');
      const alertBox = document.getElementById('alertBox');

      function showAlert(msg, isSuccess = false) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
        alertBox.style.display = 'block';
      }
      });

      // Handle Registration
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const otp = document.getElementById('otp').value;
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email, phone, otp, password })
          });
          const data = await res.json();

          if (data.success && data.token) {
            localStorage.setItem('jwtToken', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));

            showAlert('Account created! Redirecting...', true);
            setTimeout(() => {
              window.location.href = '/dashboard.html';
            }, 1200);
          } else {
            showAlert(data.message || 'Registration failed.');
          }
        } catch (err) {
          showAlert('Server connection error.');
        }
      });
    });
  </script>
</body>
          </html>
