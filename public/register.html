<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Apex Ventures</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at top right,
                    #173c2c,
                    transparent 42%
                ),
                #050b08;

            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 31px;
            letter-spacing: 1px;
            color: #d7b45a;
        }

        .brand p {
            margin-top: 7px;
            color: #91a69a;
            font-size: 14px;
        }

        .card {
            background: rgba(13, 25, 20, .96);
            border: 1px solid rgba(215, 180, 90, .18);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #899b91;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #b8c8bf;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border-radius: 12px;
            border: 1px solid #263a31;

            background: #08120e;
            color: #fff;

            outline: none;
            font-size: 15px;

            transition: .2s;
        }

        input:focus {
            border-color: #d7b45a;

            box-shadow:
                0 0 0 3px
                rgba(215,180,90,.08);
        }

        input::placeholder {
            color: #53665d;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #d7b45a;
            font-size: 12px;

            width: auto;
            padding: 5px;

            cursor: pointer;
        }

        .show-password:hover {
            background: transparent;
        }

        .terms {
            display: flex;
            gap: 9px;
            align-items: flex-start;

            color: #899b91;
            font-size: 12px;

            margin: 5px 0 20px;
        }

        .terms input {
            width: 15px;
            height: 15px;
            margin-top: 1px;
            accent-color: #d7b45a;
        }

        .terms a {
            color: #d7b45a;
            text-decoration: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #d7b45a,
                    #a88635
                );

            color: #08100c;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        button.submit-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        button.submit-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            padding: 12px;
            margin-bottom: 16px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;

            color: #ff9b9b;
            background: rgba(180,40,40,.12);
            border: 1px solid rgba(255,80,80,.12);
        }

        .message.success {
            display: block;

            color: #78e0a6;
            background: rgba(40,150,90,.12);
            border: 1px solid rgba(80,220,140,.12);
        }

        .login-link {
            text-align: center;
            margin-top: 21px;

            color: #84978e;
            font-size: 14px;
        }

        .login-link a {
            color: #d7b45a;
            text-decoration: none;
            font-weight: bold;
        }

        .spinner {
            display: inline-block;

            width: 15px;
            height: 15px;

            border: 2px solid rgba(0,0,0,.25);
            border-top-color: #08100c;

            border-radius: 50%;

            animation: spin .7s linear infinite;

            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .requirements {
            margin-top: -7px;
            margin-bottom: 16px;

            color: #62756c;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>APEX VENTURES</h1>
        <p>Build. Invest. Grow.</p>
    </div>


    <div class="card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join Apex Ventures and create your account.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="registerForm">

            <!-- NAME -->

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="80"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="120"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'password',
                            this
                        )"
                    >
                        Show
                    </button>

                </div>

            </div>


            <div class="requirements">
                Use at least 8 characters.
            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'confirmPassword',
                            this
                        )"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- TERMS -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="terms.html">
                        Terms & Conditions
                    </a>
                    and understand the Apex Ventures
                    account rules.
                </span>

            </label>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script>

/*
==================================================
API CONFIGURATION
==================================================

If register.html is served by the same Express
server, leave this empty.

Example:
const API_URL = "";

If frontend is hosted separately:

const API_URL =
    "https://your-api.onrender.com";
*/

const API_URL = "";


/*
==================================================
ELEMENTS
==================================================
*/

const form =
    document.getElementById(
        "registerForm"
    );

const message =
    document.getElementById(
        "message"
    );

const button =
    document.getElementById(
        "registerBtn"
    );


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/*
==================================================
PASSWORD VISIBILITY
==================================================
*/

function togglePassword(
    id,
    button
) {

    const input =
        document.getElementById(id);

    if (
        input.type === "password"
    ) {

        input.type = "text";

        button.textContent =
            "Hide";

    } else {

        input.type = "password";

        button.textContent =
            "Show";
    }

}


/*
==================================================
REGISTRATION
==================================================
*/

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /*
         * Get values
         */

        const name =
            document
                .getElementById("name")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;

        const terms =
            document
                .getElementById("terms")
                .checked;


        /*
         * Validation
         */

        if (name.length < 2) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        if (!terms) {

            showMessage(
                "Please accept the terms and conditions.",
                "error"
            );

            return;
        }


        /*
         * Loading state
         */

        button.disabled = true;

        button.innerHTML =
            `
            <span class="spinner"></span>
            Creating account...
            `;


        try {

            /*
             * Send registration request
             */

            const response =
                await fetch(
                    `${API_URL}/api/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                name,
                                email,
                                password
                            })
                    }
                );


            /*
             * Read response
             */

            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};
            }


            /*
             * Handle backend error
             */

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Registration failed."
                );
            }


            /*
             * If backend returns JWT,
             * save it.
             */

            if (
                data.accessToken
            ) {

                localStorage.setItem(
                    "apexAccessToken",
                    data.accessToken
                );

            }


            /*
             * Success
             */

            showMessage(
                data.message ||
                "Account created successfully.",
                "success"
            );


            /*
             * Redirect
             */

            setTimeout(
                () => {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );


            /*
             * Restore button
             */

            button.disabled =
                false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>

</body>
</html>
