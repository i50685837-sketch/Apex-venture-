<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Ventures — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="default"]{
    --bg:#0b1b34; --bg-elevated:#0f2140; --bg-card:#122548;
    --panel-border:rgba(198,164,92,0.18);
    --text-primary:#f3ede0; --text-secondary:#9fb0c9; --text-faint:#5f7291;
    --brass:#c6a45c; --brass-bright:#e0bd76; --navy-deep:#08152a;
    --positive:#5fb98a; --negative:#d97a6c; --overlay:rgba(4,10,22,0.6);
  }
  :root[data-theme="dark"]{
    --bg:#05070c; --bg-elevated:#0a0d14; --bg-card:#0e121b;
    --panel-border:rgba(198,164,92,0.14);
    --text-primary:#eceef2; --text-secondary:#8992a3; --text-faint:#4d5566;
    --brass:#c6a45c; --brass-bright:#e0bd76; --navy-deep:#000103;
    --positive:#57a67d; --negative:#c76a5d; --overlay:rgba(0,0,0,0.7);
  }
  :root[data-theme="light"]{
    --bg:#f4f1e8; --bg-elevated:#ffffff; --bg-card:#ffffff;
    --panel-border:rgba(11,27,52,0.1);
    --text-primary:#0b1b34; --text-secondary:#4a5670; --text-faint:#8894ac;
    --brass:#a3813d; --brass-bright:#8a6a2f; --navy-deep:#0b1b34;
    --positive:#2f8f5f; --negative:#c1503f; --overlay:rgba(11,27,52,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'IBM Plex Sans', sans-serif; background:var(--bg); color:var(--text-primary);
    min-height:100vh; transition:background .3s ease, color .3s ease; overflow-x:hidden; }
  h1,h2,h3,.brand{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px;
    background:var(--bg-elevated); border-bottom:1px solid var(--panel-border); position:sticky; top:0; z-index:40; }
  .brand{ font-size:1.3rem; font-weight:600; letter-spacing:.02em; display:flex; align-items:center; gap:8px; }
  .brand-mark{ width:10px; height:10px; border-radius:50%; background:var(--brass-bright); box-shadow:0 0 10px var(--brass-bright); }
  .hamburger{ width:42px; height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    background:transparent; border:1px solid var(--panel-border); border-radius:8px; cursor:pointer; }
  .hamburger span{ display:block; width:20px; height:2px; background:var(--text-primary); transition:transform .3s ease, opacity .3s ease; }
  .hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2){ opacity:0; }
  .hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  .user-chip{ display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--text-secondary); }
  .user-dot{ width:8px; height:8px; border-radius:50%; background:var(--positive); }

  .overlay{ position:fixed; inset:0; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:45; }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .drawer{ position:fixed; top:0; left:0; height:100%; width:280px; background:var(--navy-deep);
    border-right:1px solid var(--panel-border); transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1); z-index:50; display:flex; flex-direction:column; padding:24px 0; }
  .drawer.open{ transform:translateX(0); }
  .drawer-header{ padding:0 22px 20px; border-bottom:1px solid var(--panel-border); margin-bottom:14px; }
  .drawer-header .brand{ color:var(--brass-bright); }
  .drawer-sub{ font-size:.72rem; color:var(--text-faint); margin-top:4px; letter-spacing:.04em; text-transform:uppercase; }

  .nav-list{ list-style:none; flex:1; overflow-y:auto; }
  .nav-item{ display:flex; align-items:center; gap:14px; padding:13px 22px; color:var(--text-secondary);
    text-decoration:none; cursor:pointer; border-left:3px solid transparent;
    transition:background .2s ease, color .2s ease, border-color .2s ease; font-size:.95rem; }
  .nav-item:hover{ background:rgba(198,164,92,0.06); color:var(--text-primary); }
  .nav-item.active{ color:var(--brass-bright); border-left-color:var(--brass-bright); background:rgba(198,164,92,0.08); }
  .nav-icon{ width:20px; text-align:center; font-size:1.05rem; }
  .nav-divider{ margin:14px 22px; height:1px; background:var(--panel-border); }
  .nav-group-label{ padding:6px 22px; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); }
  .drawer-footer{ padding:16px 22px 4px; border-top:1px solid var(--panel-border); }

  .theme-row{ display:flex; gap:8px; margin-bottom:14px; }
  .theme-btn{ flex:1; padding:8px 0; border-radius:8px; cursor:pointer; border:1px solid var(--panel-border);
    background:var(--bg-card); color:var(--text-secondary); font-size:.75rem; font-family:'IBM Plex Mono', monospace; transition:all .2s ease; }
  .theme-btn.active{ border-color:var(--brass-bright); color:var(--brass-bright); }

  .logout-btn{ width:100%; padding:11px; border-radius:8px; cursor:pointer; background:transparent;
    border:1px solid var(--negative); color:var(--negative); font-weight:500; font-size:.9rem;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s ease; }
  .logout-btn:hover{ background:rgba(217,122,108,0.1); }

  main{ padding:32px 24px; max-width:1100px; margin:0 auto; min-height:60vh; }

  /* States shown while a page is loading / missing */
  .loader{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--text-faint); gap:14px; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--panel-border); border-top-color:var(--brass-bright); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .page-missing{ text-align:center; padding:70px 20px; }
  .page-missing h2{ font-size:1.3rem; margin-bottom:8px; color:var(--text-primary); }
  .page-missing p{ color:var(--text-secondary); font-size:.92rem; max-width:420px; margin:0 auto; }
  .page-missing .mono{ display:block; margin-top:14px; font-size:.78rem; color:var(--text-faint); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-elevated);
    border:1px solid var(--panel-border); color:var(--text-primary); padding:12px 20px; border-radius:10px; font-size:.88rem;
    opacity:0; pointer-events:none; transition:all .3s ease; z-index:60; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ border-color:var(--negative); color:var(--negative); }

  @media (max-width:600px){ main{ padding:20px 16px; } .drawer{ width:78%; } }
</style>
</head>
<body>

<div class="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="brand"><span class="brand-mark"></span>Apex Ventures</div>
  <div class="user-chip"><span class="user-dot"></span><span id="userLabel">Loading…</span></div>
</div>

<div class="overlay" id="overlay"></div>

<nav class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="brand"><span class="brand-mark"></span>Apex</div>
    <div class="drawer-sub">Investor Portal</div>
  </div>

  <ul class="nav-list">
    <li class="nav-item active" data-page="home"><span class="nav-icon">⌂</span> Home</li>
    <li class="nav-item" data-page="overview"><span class="nav-icon">▤</span> Dashboard</li>
    <li class="nav-item" data-page="surveys"><span class="nav-icon">✎</span> Surveys</li>
    <div class="nav-divider"></div>
    <div class="nav-group-label">Wallet</div>
    <li class="nav-item" data-page="deposit"><span class="nav-icon">↓</span> Deposit</li>
    <li class="nav-item" data-page="withdrawal"><span class="nav-icon">↑</span> Withdrawal</li>
    <div class="nav-divider"></div>
    <div class="nav-group-label">Grow</div>
    <li class="nav-item" data-page="invest"><span class="nav-icon">◈</span> Invest</li>
    <li class="nav-item" data-page="loan"><span class="nav-icon">⌘</span> Borrow / Loan</li>
    <div class="nav-divider"></div>
    <li class="nav-item" data-page="settings"><span class="nav-icon">⚙</span> Settings</li>
  </ul>

  <div class="drawer-footer">
    <div class="theme-row">
      <button class="theme-btn active" data-theme-btn="default">Navy</button>
      <button class="theme-btn" data-theme-btn="dark">Dark</button>
      <button class="theme-btn" data-theme-btn="light">Light</button>
    </div>
    <button class="logout-btn" id="logoutBtn">⏻ Log out</button>
  </div>
</nav>

<main id="content">
  <div class="loader"><div class="spinner"></div><span>Loading…</span></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   APEX CONFIG — edit these to match your backend
   ========================================================= */
const APEX_CONFIG = {
  API_BASE: "https://api.apexventures.example/v1",   // <-- your backend base URL
  PAGES_PATH: "./pages",                               // folder holding surveys.html, loan.html, settings.html, etc.
  TOKEN_KEY: "apex_token",                             // localStorage key for the JWT
  LOGIN_URL: "./login.html"
};

/* =========================================================
   apiFetch — shared REST/JWT helper.
   Every page partial can call window.Apex.apiFetch(...)
   ========================================================= */
async function apiFetch(path, options = {}) {
  const token = localStorage.getItem(APEX_CONFIG.TOKEN_KEY);
  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {})
  };
  const res = await fetch(`${APEX_CONFIG.API_BASE}${path}`, { ...options, headers });

  if (res.status === 401) {
    localStorage.removeItem(APEX_CONFIG.TOKEN_KEY);
    window.location.href = APEX_CONFIG.LOGIN_URL;
    throw new Error("Session expired");
  }
  if (!res.ok) {
    let msg = `Request failed (${res.status})`;
    try { const body = await res.json(); msg = body.message || msg; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function showToast(message, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.toggle("error", isError);
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 3200);
}

function formatCurrency(amount, currency = "KES") {
  return `${currency} ${Number(amount || 0).toLocaleString()}`;
}

// Exposed for every dynamically-loaded page partial to use
window.Apex = { apiFetch, showToast, formatCurrency, config: APEX_CONFIG };

/* =========================================================
   Drawer + hamburger
   ========================================================= */
const hamburgerBtn = document.getElementById('hamburgerBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
const navItems = document.querySelectorAll('.nav-item');
const html = document.documentElement;
const content = document.getElementById('content');

function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('show'); hamburgerBtn.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('show'); hamburgerBtn.classList.remove('open'); }
hamburgerBtn.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
overlay.addEventListener('click', closeDrawer);

/* =========================================================
   Page loader — fetches /pages/{name}.html, injects it, and
   runs any <script> tags inside it (innerHTML alone won't
   execute scripts, so we recreate them).
   ========================================================= */
const pageCache = {};

async function loadPage(name) {
  content.innerHTML = `<div class="loader"><div class="spinner"></div><span>Loading…</span></div>`;

  try {
    let html;
    if (pageCache[name]) {
      html = pageCache[name];
    } else {
      const res = await fetch(`${APEX_CONFIG.PAGES_PATH}/${name}.html`, { cache: "no-store" });
      if (!res.ok) throw new Error("not-found");
      html = await res.text();
      pageCache[name] = html;
    }

    content.innerHTML = html;

    // Re-execute any <script> tags from the injected partial
    content.querySelectorAll("script").forEach(oldScript => {
      const newScript = document.createElement("script");
      if (oldScript.src) newScript.src = oldScript.src;
      else newScript.textContent = oldScript.textContent;
      oldScript.replaceWith(newScript);
    });

  } catch (err) {
    content.innerHTML = `
      <div class="page-missing">
        <h2>This page isn't built yet</h2>
        <p>Dashboard.html is looking for <strong>${name}.html</strong> inside <strong>${APEX_CONFIG.PAGES_PATH}/</strong> and it hasn't been added, or the request failed.</p>
        <span class="mono">Expected file: ${APEX_CONFIG.PAGES_PATH}/${name}.html</span>
      </div>`;
  }
}

navItems.forEach(item => {
  item.addEventListener('click', () => {
    navItems.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const target = item.getAttribute('data-page');
    loadPage(target);
    closeDrawer();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    history.replaceState(null, "", `#${target}`);
  });
});

// Load whatever page matches the URL hash on first load, else "home"
const initialPage = (location.hash || "#home").slice(1);
const initialNavItem = document.querySelector(`.nav-item[data-page="${initialPage}"]`);
if (initialNavItem) {
  navItems.forEach(i => i.classList.remove('active'));
  initialNavItem.classList.add('active');
}
loadPage(initialPage || "home");

/* =========================================================
   Theme switcher
   ========================================================= */
const themeBtns = document.querySelectorAll('[data-theme-btn]');
themeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const theme = btn.getAttribute('data-theme-btn');
    html.setAttribute('data-theme', theme);
    themeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    try { localStorage.setItem('apex-theme', theme); } catch (e) {}
  });
});
try {
  const saved = localStorage.getItem('apex-theme');
  if (saved) {
    html.setAttribute('data-theme', saved);
    themeBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-theme-btn') === saved));
  }
} catch (e) {}

/* =========================================================
   Auth: current user + logout
   ========================================================= */
async function loadUser() {
  try {
    const me = await apiFetch("/auth/me");
    document.getElementById("userLabel").textContent = me.name || me.email || "Account";
  } catch (err) {
    document.getElementById("userLabel").textContent = "Not signed in";
  }
}
loadUser();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (!confirm('Log out of Apex Ventures?')) return;
  try {
    await apiFetch("/auth/logout", { method: "POST" });
  } catch (err) {
    // proceed with local logout even if the server call fails
  } finally {
    localStorage.removeItem(APEX_CONFIG.TOKEN_KEY);
    window.location.href = APEX_CONFIG.LOGIN_URL;
  }
});
</script>

</body>
  </html>
