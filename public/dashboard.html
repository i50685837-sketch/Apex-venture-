<style>
:root[data-theme="default"]{
--bg:#0b1b34;
--bg-elevated:#0f2140;
--bg-card:#122548;
--border:rgba(198,164,92,.18);
--text:#f3ede0;
--muted:#9fb0c9;
--faint:#5f7291;
--gold:#c6a45c;
--gold2:#e0bd76;
--deep:#08152a;
--green:#5fb98a;
--red:#d97a6c;
--overlay:rgba(4,10,22,.65);
}

:root[data-theme="dark"]{
--bg:#05070c;
--bg-elevated:#0a0d14;
--bg-card:#0e121b;
--border:rgba(198,164,92,.14);
--text:#eceef2;
--muted:#8992a3;
--faint:#4d5566;
--gold:#c6a45c;
--gold2:#e0bd76;
--deep:#000103;
--green:#57a67d;
--red:#c76a5d;
--overlay:rgba(0,0,0,.75);
}

:root[data-theme="light"]{
--bg:#f4f1e8;
--bg-elevated:#fff;
--bg-card:#fff;
--border:rgba(11,27,52,.1);
--text:#0b1b34;
--muted:#4a5670;
--faint:#8894ac;
--gold:#a3813d;
--gold2:#8a6a2f;
--deep:#0b1b34;
--green:#2f8f5f;
--red:#c1503f;
--overlay:rgba(11,27,52,.35);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'IBM Plex Sans',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
transition:.3s;
}

h1,h2,h3,.brand{
font-family:'Fraunces',serif;
}

.mono{
font-family:'IBM Plex Mono',monospace;
}

/* TOPBAR */

.topbar{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
background:var(--bg-elevated);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:40;
}

.brand{
font-size:1.3rem;
font-weight:600;
display:flex;
align-items:center;
gap:9px;
}

.brand-mark{
width:10px;
height:10px;
border-radius:50%;
background:var(--gold2);
box-shadow:0 0 12px var(--gold2);
}

.hamburger{
width:42px;
height:42px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
background:transparent;
border:1px solid var(--border);
border-radius:9px;
cursor:pointer;
}

.hamburger span{
width:20px;
height:2px;
background:var(--text);
transition:.3s;
}

.hamburger.open span:nth-child(1){
transform:translateY(7px) rotate(45deg);
}

.hamburger.open span:nth-child(2){
opacity:0;
}

.hamburger.open span:nth-child(3){
transform:translateY(-7px) rotate(-45deg);
}

.user-chip{
display:flex;
align-items:center;
gap:8px;
font-size:.82rem;
color:var(--muted);
}

.user-dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
}

/* DRAWER */

.overlay{
position:fixed;
inset:0;
background:var(--overlay);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:45;
}

.overlay.show{
opacity:1;
pointer-events:auto;
}

.drawer{
position:fixed;
top:0;
left:0;
height:100%;
width:285px;
background:var(--deep);
border-right:1px solid var(--border);
transform:translateX(-100%);
transition:.35s;
z-index:50;
display:flex;
flex-direction:column;
padding:24px 0;
}

.drawer.open{
transform:translateX(0);
}

.drawer-header{
padding:0 22px 20px;
border-bottom:1px solid var(--border);
margin-bottom:12px;
}

.drawer-header .brand{
color:var(--gold2);
}

.drawer-sub{
font-size:.7rem;
color:var(--faint);
margin-top:5px;
text-transform:uppercase;
letter-spacing:.08em;
}

.nav-list{
list-style:none;
flex:1;
overflow-y:auto;
}

.nav-item{
display:flex;
align-items:center;
gap:14px;
padding:13px 22px;
color:var(--muted);
cursor:pointer;
border-left:3px solid transparent;
transition:.2s;
font-size:.94rem;
}

.nav-item:hover{
background:rgba(198,164,92,.06);
color:var(--text);
}

.nav-item.active{
color:var(--gold2);
border-left-color:var(--gold2);
background:rgba(198,164,92,.08);
}

.nav-icon{
width:20px;
text-align:center;
}

.nav-divider{
height:1px;
background:var(--border);
margin:14px 22px;
}

.nav-group-label{
padding:6px 22px;
font-size:.67rem;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--faint);
}

.drawer-footer{
padding:16px 22px 4px;
border-top:1px solid var(--border);
}

.theme-row{
display:flex;
gap:7px;
margin-bottom:14px;
}

.theme-btn{
flex:1;
padding:8px 0;
border-radius:8px;
border:1px solid var(--border);
background:var(--bg-card);
color:var(--muted);
cursor:pointer;
font-size:.72rem;
font-family:'IBM Plex Mono',monospace;
}

.theme-btn.active{
border-color:var(--gold2);
color:var(--gold2);
}

.logout-btn{
width:100%;
padding:11px;
border-radius:8px;
background:transparent;
border:1px solid var(--red);
color:var(--red);
cursor:pointer;
font-weight:500;
}

/* MAIN */

main{
max-width:1100px;
margin:auto;
padding:30px 24px 60px;
}

.page{
animation:fade .25s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:none;
}
}

.page-title{
margin-bottom:5px;
font-size:1.9rem;
}

.page-subtitle{
color:var(--muted);
font-size:.9rem;
margin-bottom:25px;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:15px;
padding:20px;
}

.card-label{
font-size:.75rem;
color:var(--muted);
margin-bottom:10px;
}

.card-value{
font-size:1.45rem;
font-family:'IBM Plex Mono',monospace;
}

.card-value.gold{
color:var(--gold2);
}

.card-value.green{
color:var(--green);
}

/* ACTIONS */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.action{
padding:16px;
border:1px solid var(--border);
border-radius:12px;
background:var(--bg-card);
color:var(--text);
cursor:pointer;
text-align:left;
transition:.2s;
}

.action:hover{
border-color:var(--gold);
transform:translateY(-2px);
}

.action strong{
display:block;
margin-bottom:5px;
}

.action span{
font-size:.78rem;
color:var(--muted);
}

/* TABLE */

.table-wrap{
overflow-x:auto;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th,td{
padding:13px 12px;
border-bottom:1px solid var(--border);
text-align:left;
font-size:.82rem;
}

th{

.status{

padding:5px 9px;
border-radius:20px;
font-size:.7rem;

.status.success{

color:var(--green);
}

.status.pending{
background:rgba(198,164,92,.1);

}

/* FORM */

.form{

.field{
margin-bottom:16px;

.field label{

.field input,

border:1px solid var(--border);

color:var(--text);

.field input:focus,

.primary{

padding:13px;
border:0;
border-radius:10px;
background:linear-gradient(135deg,var(--gold2),var(--gold));
color:#08152a;
font-weight:600;
cursor:pointer;
}

/* INVESTMENT */

.plan-grid{
display:grid;

.plan{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:15px;
padding:20px;
position:relative;

.plan.featured{
border-color:var(--gold);

.badge{
position:absolute;

font-size:.65rem;
color:var(--gold2);
border:1px solid var(--gold);

border-radius:20px;

.plan h3{
margin-bottom:14px;

.plan p{

.plan button{

/* MESSAGE */

margin-bottom:18px;

display:block;

.topbar{

.user-chip span:last-child{
max-width:100px;
overflow:hidden;
text-overflow:ellipsis;

}

}

@media(max-width:430px){

width:82%;
}

.page-title{
font-size:1.55rem;
}

.card{
padding:17px;
}

}
</style>

/* =========================================================
   APEX CONFIG
   Same-domain API.
   No fake api.apexventures.example URL.
========================================================= */

const CONFIG = {

    API_BASE: "/api",

    TOKEN_KEY: "apex_token",

    LOGIN_URL: "./login.html"

};


/* =========================================================
   API HELPER
========================================================= */

async function apiFetch(
    path,
    options = {}
){

    const token =
        localStorage.getItem(
            CONFIG.TOKEN_KEY
        );


    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    if(token){

        headers.Authorization =
            `Bearer ${token}`;

    }


    const response =
        await fetch(
            `${CONFIG.API_BASE}${path}`,
            {
                ...options,
                headers
            }
        );


    if(
        response.status === 401 ||
        response.status === 403
    ){

        localStorage.removeItem(
            CONFIG.TOKEN_KEY
        );

        window.location.href =
            CONFIG.LOGIN_URL;

        throw new Error(
            "Session expired"
        );

    }


    let data = null;

    const contentType =
        response.headers.get(
            "content-type"
        );


    if(
        contentType &&
        contentType.includes(
            "application/json"
        )
    ){

        data =
            await response.json();

    }


    if(!response.ok){

        throw new Error(
            data?.message ||
            data?.error ||
            `Request failed (${response.status})`
        );

    }


    return data;

}


/* =========================================================
   HELPERS
========================================================= */

function money(
    amount
){

    return `KES ${
        Number(amount || 0)
        .toLocaleString(
            "en-KE",
            {
                minimumFractionDigits:2
            }
        )
    }`;

}


function toast(
    message
){

    alert(message);

}


/* =========================================================
   DRAWER
========================================================= */

const drawer =
    document.getElementById(
        "drawer"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const hamburger =
    document.getElementById(
        "hamburger"
    );


function openMenu(){

    drawer.classList.add(
        "open"
    );

    overlay.classList.add(
        "show"
    );

    hamburger.classList.add(
        "open"
    );

}


function closeMenu(){

    drawer.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );

    hamburger.classList.remove(
        "open"
    );

}


hamburger.onclick =
    () => {

        drawer.classList.contains(
            "open"
        )
        ? closeMenu()
        : openMenu();

    };


overlay.onclick =
    closeMenu;


/* =========================================================
   CONTENT
   Everything is inside this dashboard.
   No missing /pages folder.
========================================================= */

const content =
    document.getElementById(
        "content"
    );


function render(page){

    const pages = {

        home: homePage,

        overview: overviewPage,

        surveys: surveysPage,

        deposit: depositPage,

        withdrawal: withdrawalPage,

        invest: investPage,

        loan: loanPage,

        settings: settingsPage

    };


    content.innerHTML =
        (pages[page] || homePage)();

    content
        .querySelectorAll(
            "[data-action]"
        )
        .forEach(
            attachActions
        );

}

  border:1px solid var(--panel-border);
  border-radius:14px;
  background:var(--bg-elevated);
}

.balance-card span{
  display:block;
  color:var(--text-secondary);
  font-size:.78rem;
  margin-bottom:9px;
}

.balance-card strong{
  font-family:'IBM Plex Mono',monospace;
  font-size:1.15rem;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:1.35rem;
}

.section-title span{
  color:var(--text-faint);
  font-size:.8rem;
}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.plan-card{
  position:relative;
  padding:22px;
  border:1px solid var(--panel-border);
  border-radius:16px;
  background:var(--bg-card);
  transition:.25s;
}

.plan-card:hover{
  transform:translateY(-3px);
  border-color:var(--brass);
}

.plan-card.featured{
  border-color:var(--brass);
  box-shadow:0 0 25px rgba(198,164,92,.08);
}

.plan-badge{
  position:absolute;
  right:14px;
  top:14px;
  padding:4px 8px;
  border-radius:20px;
  font-size:.65rem;
  color:var(--brass-bright);
  border:1px solid var(--panel-border);
}

.plan-card h3{
  margin-bottom:15px;
}

.plan-amount{
  font-family:'IBM Plex Mono',monospace;
  font-size:1.35rem;
  margin-bottom:15px;
}

.plan-info{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-top:1px solid var(--panel-border);
  font-size:.82rem;
}

.plan-info span:first-child{
  color:var(--text-secondary);
}

.profit{
  color:var(--positive);
}

.start-btn{
  width:100%;
  margin-top:17px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:var(--brass);
  color:var(--navy-deep);
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.start-btn:hover{
  background:var(--brass-bright);
  transform:translateY(-1px);
}

/* Growth chart */
.chart-card{
  padding:22px;
  border:1px solid var(--panel-border);
  border-radius:16px;
  background:var(--bg-card);
}

.chart-wrap{
  position:relative;
  height:280px;
  margin-top:15px;
  border-left:1px solid var(--panel-border);
  border-bottom:1px solid var(--panel-border);
  overflow:hidden;
}

.grid-line{
  position:absolute;
  left:0;
  right:0;
  border-top:1px dashed var(--panel-border);
}

.grid-1{top:20%}
.grid-2{top:40%}
.grid-3{top:60%}
.grid-4{top:80%}

.y-label{
  position:absolute;
  left:-45px;
  color:var(--text-faint);
  font:10px 'IBM Plex Mono',monospace;
}

.y1{top:17%}
.y2{top:37%}
.y3{top:57%}
.y4{top:77%}

.chart-line{
  position:absolute;
  left:5%;
  right:3%;
  top:25%;
  height:55%;
}

.chart-line svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.chart-path{
  fill:none;
  stroke:var(--brass-bright);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.chart-area{
  fill:rgba(198,164,92,.08);
}

.chart-dot{
  fill:var(--brass-bright);
}

.x-axis{
  display:flex;
  justify-content:space-between;
  padding:8px 4px 0;
  color:var(--text-faint);
  font:10px 'IBM Plex Mono',monospace;
}

/* Transaction */
.transactions{
  border:1px solid var(--panel-border);
  border-radius:16px;
  background:var(--bg-card);
  overflow:hidden;
}

.transaction{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--panel-border);
}

.transaction:last-child{
  border-bottom:0;
}

.transaction-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.transaction-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(198,164,92,.08);
  color:var(--brass-bright);
}

.transaction-name{
  font-size:.88rem;
}

.transaction-date{
  color:var(--text-faint);
  font-size:.7rem;
  margin-top:3px;
}

.transaction-amount{
  font-family:'IBM Plex Mono',monospace;
  font-size:.82rem;
}

.modal{
  position:fixed;
  inset:0;
  background:var(--overlay);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:420px;
  background:var(--bg-card);
  border:1px solid var(--panel-border);
  border-radius:18px;
  padding:24px;
}

.modal-box h2{
  margin-bottom:8px;
}

.modal-box p{
  color:var(--text-secondary);
  font-size:.85rem;
  margin-bottom:18px;
}

.modal-box input{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid var(--panel-border);
  background:var(--bg-elevated);
  color:var(--text-primary);
  outline:none;
  margin-bottom:12px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
}

.cancel-btn{
  background:transparent;
  border:1px solid var(--panel-border);
  color:var(--text-secondary);
}

.confirm-btn{
  background:var(--brass);
  border:0;
  color:var(--navy-deep);
  font-weight:600;
}

@media(max-width:850px){
  .plan-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .balance-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .plan-grid,

    grid-template-columns:1fr;
  }

  .invest-hero{
    padding:22px;
  }

  .invest-hero h1{
    font-size:1.6rem;
  }
}

<script>
(() => {

  const modal = document.getElementById("investmentModal");
  const amountInput = document.getElementById("investmentAmount");

  let selectedPlan = null;
  let minimumAmount = 0;


  /* ==========================================
     LOAD INVESTMENT DATA
  ========================================== */

  async function loadInvestmentData(){

    try{

      const data = await window.Apex.apiFetch("/investments/summary");

      document.getElementById("availableBalance").textContent =
        window.Apex.formatCurrency(data.availableBalance || 0);

      document.getElementById("investedBalance").textContent =
        window.Apex.formatCurrency(data.totalInvested || 0);

      document.getElementById("growthBalance").textContent =
        window.Apex.formatCurrency(data.totalGrowth || 0);

      if(Array.isArray(data.transactions)){
        renderTransactions(data.transactions);
      }

    }catch(error){

      console.log("Investment summary unavailable:", error.message);

    }

  }


  /* ==========================================
     TRANSACTIONS
  ========================================== */

  function renderTransactions(items){

    const container =
      document.getElementById("transactions");

    if(!items.length){

      container.innerHTML = `
        <div class="transaction">
          <div class="transaction-left">
            <div class="transaction-icon">◈</div>

            <div>
              <div class="transaction-name">
                No transactions
              </div>

              <div class="transaction-date">
                Investment activity will appear here
              </div>
            </div>
          </div>
        </div>
      `;

      return;
    }

    container.innerHTML = items.map(item => `

      <div class="transaction">

        <div class="transaction-left">

          <div class="transaction-icon">
            ${item.type === "profit" ? "↗" : "◈"}
          </div>

          <div>

            <div class="transaction-name">
              ${escapeHTML(item.plan || "Investment")}
            </div>

            <div class="transaction-date">
              ${escapeHTML(item.status || "Processed")}
            </div>

          </div>

        </div>

        <div class="transaction-amount ${
          item.type === "profit" ? "profit" : ""
        }">

          ${window.Apex.formatCurrency(item.amount || 0)}

        </div>

      </div>

    `).join("");

  }


  function escapeHTML(value){

    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  /* ==========================================
     START INVESTMENT BUTTONS
  ========================================== */

  document.querySelectorAll(".start-btn").forEach(button => {

    button.addEventListener("click", () => {

      selectedPlan = button.dataset.plan;
      minimumAmount = Number(button.dataset.min);

      document.getElementById("modalTitle").textContent =
        `Start ${selectedPlan} Investment`;

      document.getElementById("modalDescription").textContent =
        `Minimum amount for the ${selectedPlan} plan is KES ${minimumAmount.toLocaleString()}.`;

      amountInput.value = minimumAmount;
      amountInput.min = minimumAmount;

      modal.classList.add("show");

      setTimeout(() => amountInput.focus(),100);

    });

  });


  /* ==========================================
     CANCEL
  ========================================== */

  document.getElementById("cancelInvestment")
    .addEventListener("click", () => {

      modal.classList.remove("show");
      amountInput.value = "";

    });


  /* ==========================================
     CONFIRM
  ========================================== */

  document.getElementById("confirmInvestment")
    .addEventListener("click", async () => {

      const amount = Number(amountInput.value);

      if(!amount || amount < minimumAmount){

        window.Apex.showToast(
          `Minimum investment is KES ${minimumAmount.toLocaleString()}`,
          true
        );

        return;
      }

      const confirmButton =
        document.getElementById("confirmInvestment");

      confirmButton.disabled = true;
      confirmButton.textContent = "Processing…";

      try{

        /*
         * This calls your backend.
         * Your backend should validate the user's balance,
         * plan and amount before creating an investment.
         */

        await window.Apex.apiFetch("/investments", {
          method:"POST",
          body:JSON.stringify({
            plan:selectedPlan,
            amount:amount
          })
        });

        modal.classList.remove("show");
        amountInput.value = "";

        window.Apex.showToast(
          "Investment request submitted successfully."
        );

        await loadInvestmentData();

      }catch(error){

        window.Apex.showToast(
          error.message || "Unable to start investment.",
          true
        );

      }finally{

        confirmButton.disabled = false;
        confirmButton.textContent = "Continue";

      }

    });


  /* ==========================================
     CLOSE MODAL OUTSIDE
  ========================================== */

  modal.addEventListener("click", event => {

    if(event.target === modal){
      modal.classList.remove("show");
    }

  });


  loadInvestmentData();

})();
</script>
