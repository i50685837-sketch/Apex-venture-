<style>
:root[data-theme="default"]{
--bg:#0b1b34;
--bg-elevated:#0f2140;
--bg-card:#122548;
--border:rgba(198,164,92,.18);
--text:#f3ede0;
--muted:#9fb0c9;
--faint:#5f7291;
--gold:#c6a45c;
--gold2:#e0bd76;
--deep:#08152a;
--green:#5fb98a;
--red:#d97a6c;

:root[data-theme="dark"]{
--bg:#05070c;
--bg-elevated:#0a0d14;
--bg-card:#0e121b;
--border:rgba(198,164,92,.14);
--text:#eceef2;
--muted:#8992a3;
--faint:#4d5566;
--gold:#c6a45c;
--gold2:#e0bd76;
--deep:#000103;
--green:#57a67d;
--red:#c76a5d;
--overlay:rgba(0,0,0,.75);
}

:root[data-theme="light"]{
--bg:#f4f1e8;
--bg-elevated:#fff;
--bg-card:#fff;
--border:rgba(11,27,52,.1);
--text:#0b1b34;
--muted:#4a5670;
--faint:#8894ac;
--gold:#a3813d;
--gold2:#8a6a2f;
--deep:#0b1b34;
--green:#2f8f5f;
--red:#c1503f;
--overlay:rgba(11,27,52,.35);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'IBM Plex Sans',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
transition:.3s;
}

h1,h2,h3,.brand{
font-family:'Fraunces',serif;
}

.mono{
font-family:'IBM Plex Mono',monospace;
}

/* TOPBAR */

.topbar{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
background:var(--bg-elevated);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:40;
}

.brand{
font-size:1.3rem;
font-weight:600;
display:flex;
align-items:center;
gap:9px;
}

.brand-mark{
width:10px;
height:10px;
border-radius:50%;
background:var(--gold2);
box-shadow:0 0 12px var(--gold2);
}

.hamburger{
width:42px;
height:42px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
background:transparent;
border:1px solid var(--border);
border-radius:9px;
cursor:pointer;
}

.hamburger span{
width:20px;
height:2px;
background:var(--text);
transition:.3s;
}

.hamburger.open span:nth-child(1){
transform:translateY(7px) rotate(45deg);
}

.hamburger.open span:nth-child(2){
opacity:0;
}

.hamburger.open span:nth-child(3){
transform:translateY(-7px) rotate(-45deg);
}

.user-chip{
display:flex;
align-items:center;
gap:8px;
font-size:.82rem;
color:var(--muted);
}

.user-dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
}

/* DRAWER */

.overlay{
position:fixed;
inset:0;
background:var(--overlay);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:45;
}

.overlay.show{
opacity:1;
pointer-events:auto;
}

.drawer{
position:fixed;
top:0;
left:0;
height:100%;
width:285px;
background:var(--deep);
border-right:1px solid var(--border);
transform:translateX(-100%);
transition:.35s;
z-index:50;
display:flex;
flex-direction:column;
padding:24px 0;
}

.drawer.open{
transform:translateX(0);
}

.drawer-header{
padding:0 22px 20px;
border-bottom:1px solid var(--border);
margin-bottom:12px;
}

.drawer-header .brand{
color:var(--gold2);
}

.drawer-sub{
font-size:.7rem;
color:var(--faint);
margin-top:5px;
text-transform:uppercase;
letter-spacing:.08em;
}

.nav-list{
list-style:none;
flex:1;
overflow-y:auto;
}

.nav-item{
display:flex;
align-items:center;
gap:14px;
padding:13px 22px;
color:var(--muted);
cursor:pointer;
border-left:3px solid transparent;
transition:.2s;
font-size:.94rem;
}

.nav-item:hover{
background:rgba(198,164,92,.06);
color:var(--text);
}

.nav-item.active{
color:var(--gold2);
border-left-color:var(--gold2);
background:rgba(198,164,92,.08);
}

.nav-icon{
width:20px;
text-align:center;
}

.nav-divider{
height:1px;
background:var(--border);
margin:14px 22px;
}

.nav-group-label{
padding:6px 22px;
font-size:.67rem;
letter-spacing:.1em;
text-transform:uppercase;
color:var(--faint);
}

.drawer-footer{
padding:16px 22px 4px;
border-top:1px solid var(--border);
}

.theme-row{
display:flex;
gap:7px;
margin-bottom:14px;
}

.theme-btn{
flex:1;
padding:8px 0;
border-radius:8px;
border:1px solid var(--border);
background:var(--bg-card);
color:var(--muted);
cursor:pointer;
font-size:.72rem;
font-family:'IBM Plex Mono',monospace;
}

.theme-btn.active{
border-color:var(--gold2);
color:var(--gold2);
}

.logout-btn{
width:100%;
padding:11px;
border-radius:8px;
background:transparent;
border:1px solid var(--red);
color:var(--red);
cursor:pointer;
font-weight:500;
}

/* MAIN */

main{
max-width:1100px;
margin:auto;
padding:30px 24px 60px;
}

.page{
animation:fade .25s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:none;
}
}

.page-title{
margin-bottom:5px;
font-size:1.9rem;
}

.page-subtitle{
color:var(--muted);
font-size:.9rem;
margin-bottom:25px;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:15px;
padding:20px;
}

.card-label{
font-size:.75rem;
color:var(--muted);

}

.card-value{
font-size:1.45rem;
font-family:'IBM Plex Mono',monospace;
}

.card-value.gold{
color:var(--gold2);
}

.card-value.green{
color:var(--green);
}

/* ACTIONS */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.action{
padding:16px;
border:1px solid var(--border);
border-radius:12px;
background:var(--bg-card);
color:var(--text);
cursor:pointer;
text-align:left;
transition:.2s;
}

.action:hover{
border-color:var(--gold);
transform:translateY(-2px);
}

.action strong{
display:block;
margin-bottom:5px;
}

.action span{
font-size:.78rem;
color:var(--muted);
}

/* TABLE */

.table-wrap{
overflow-x:auto;
margin-top:20px;

table{
width:100%;

th,td{
padding:13px 12px;

.status{

.status.success{

}

.status.pending{

/* FORM */

.form{

.field{

.primary{

padding:13px;

border-radius:10px;
background:linear-gradient(135deg,var(--gold2),var(--gold));

font-weight:600;
cursor:pointer;
}

/* INVESTMENT */

.plan-grid{

.plan{

border-radius:15px;
padding:20px;

.plan button{

.user-chip span:last-child{

overflow:hidden;

@media(max-width:430px){

}

}

}

}
</style>

/* =========================================================
   APEX CONFIG
   Same-domain API.
   No fake api.apexventures.example URL.
========================================================= */

const CONFIG = {

    API_BASE: "/api",

    TOKEN_KEY: "apex_token",

    LOGIN_URL: "./login.html"

};


/* =========================================================
   API HELPER
========================================================= */

async function apiFetch(
    path,
    options = {}
){

    const token =
        localStorage.getItem(
            CONFIG.TOKEN_KEY
        );


    const headers = {

        "Content-Type":
            "application/json",

        ...(options.headers || {})

    };


    if(token){

        headers.Authorization =
            `Bearer ${token}`;

    }


    const response =
        await fetch(
            `${CONFIG.API_BASE}${path}`,
            {
                ...options,
                headers
            }
        );


    if(
        response.status === 401 ||
        response.status === 403
    ){

        localStorage.removeItem(
            CONFIG.TOKEN_KEY
        );

        window.location.href =
            CONFIG.LOGIN_URL;

        throw new Error(
            "Session expired"
        );

    }


    let data = null;

    const contentType =
        response.headers.get(
            "content-type"
        );


    if(
        contentType &&
        contentType.includes(
            "application/json"
        )
    ){

        data =
            await response.json();

    }


    if(!response.ok){

        throw new Error(
            data?.message ||
            data?.error ||
            `Request failed (${response.status})`
        );

    }


    return data;

}

function money(

){

}


function toast(

/* =========================================================
   DRAWER
========================================================= */

const drawer =
    document.getElementById(
        "drawer"
    );

const overlay =
    document.getElementById(
        "overlay"
    );

const hamburger =
    document.getElementById(
        "hamburger"
    );


function openMenu(){

    drawer.classList.add(
        "open"
    );

    overlay.classList.add(
        "show"
    );

    hamburger.classList.add(
        "open"
    );

}


function closeMenu(){

    drawer.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );

    hamburger.classList.remove(
        "open"
    );

}


hamburger.onclick =
    () => {

        drawer.classList.contains(
            "open"
        )
        ? closeMenu()
        : openMenu();

    };


overlay.onclick =
    closeMenu;


/* =========================================================
   CONTENT
   Everything is inside this dashboard.
   No missing /pages folder.
========================================================= */

const content =
    document.getElementById(

    );

    const pages = {

        surveys: surveysPage,

        deposit: depositPage,

        withdrawal: withdrawalPage,

        invest: investPage,

        loan: loanPage,

        settings: settingsPage

    };


    content.innerHTML =
        (pages[page] || homePage)();

    content
        .querySelectorAll(
            "[data-action]"
        )
        .forEach(
            attachActions
        );

}
