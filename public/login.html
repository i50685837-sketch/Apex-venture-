<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Apex Ventures</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(
            circle at top left,
            #173c2c,
            transparent 42%
        ),
        #050b08;

    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    font-size:31px;
    letter-spacing:1px;
    color:#d7b45a;
}

.brand p{
    margin-top:7px;
    color:#91a69a;
    font-size:14px;
}

.card{
    background:rgba(13,25,20,.96);
    border:1px solid rgba(215,180,90,.18);
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.card h2{
    font-size:24px;
    margin-bottom:7px;
}

.subtitle{
    color:#899b91;
    font-size:14px;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#b8c8bf;
    font-size:13px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px 15px;

    border-radius:12px;
    border:1px solid #263a31;

    background:#08120e;
    color:#fff;

    outline:none;
    font-size:15px;

    transition:.2s;
}

input:focus{
    border-color:#d7b45a;

    box-shadow:
        0 0 0 3px
        rgba(215,180,90,.08);
}

input::placeholder{
    color:#53665d;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:65px;
}

.show-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);

    width:auto !important;

    padding:5px !important;

    border:none !important;
    background:transparent !important;

    color:#d7b45a !important;

    font-size:12px !important;
    font-weight:normal !important;

    cursor:pointer;
}

.show-password:hover{
    transform:translateY(-50%);
}

.forgot{
    text-align:right;
    margin:-5px 0 20px;
}

.forgot a{
    color:#d7b45a;
    text-decoration:none;
    font-size:13px;
}

.submit-btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #d7b45a,
            #a88635
        );

    color:#08100c;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;

    padding:12px;
    margin-bottom:16px;

    border-radius:10px;

    font-size:13px;
    line-height:1.4;
}

.message.error{
    display:block;

    color:#ff9b9b;
    background:rgba(180,40,40,.12);

    border:1px solid rgba(255,80,80,.12);
}

.message.success{
    display:block;

    color:#78e0a6;
    background:rgba(40,150,90,.12);

    border:1px solid rgba(80,220,140,.12);
}

.register{
    text-align:center;
    margin-top:22px;

    color:#84978e;
    font-size:14px;
}

.register a{
    color:#d7b45a;
    text-decoration:none;
    font-weight:bold;
}

.spinner{
    display:inline-block;

    width:15px;
    height:15px;

    border:2px solid rgba(0,0,0,.25);
    border-top-color:#08100c;

    border-radius:50%;

    animation:spin .7s linear infinite;

    vertical-align:middle;
    margin-right:7px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>APEX VENTURES</h1>
        <p>Welcome back</p>
    </div>


    <div class="card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to access your Apex Ventures dashboard.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">

            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- FORGOT -->

            <div class="forgot">

                <a href="forgot-password.html">
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="submit-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</div>


<script>

/*
==================================================
APEX VENTURES API
==================================================

If login.html is inside the Express public folder,
keep this empty.

The request becomes:

POST /api/auth/login
*/

const API_URL = "";


/*
==================================================
ELEMENTS
==================================================
*/

const form =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const message =
    document.getElementById(
        "message"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const showPassword =
    document.getElementById(
        "showPassword"
    );


/*
==================================================
MESSAGE
==================================================
*/

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "Hide";

        }else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "Show";
        }

    }
);


/*
==================================================
LOGIN
==================================================
*/

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        /*
        Basic validation
        */

        if(!email){

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;
        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            return;
        }


        /*
        Loading
        */

        loginBtn.disabled =
            true;

        loginBtn.innerHTML =
            `
            <span class="spinner"></span>
            Signing in...
            `;


        try{

            /*
            Send credentials
            to backend
            */

            const response =
                await fetch(
                    `${API_URL}/api/auth/login`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );


            /*
            Parse response
            */

            let data = {};

            try{

                data =
                    await response.json();

            }catch{

                data = {};

            }


            /*
            Backend error
            */

            if(
                !response.ok
            ){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Invalid email or password."
                );
            }


            /*
            JWT REQUIRED
            */

            if(
                !data.accessToken
            ){

                throw new Error(
                    "Login succeeded but the server did not return an access token."
                );
            }


            /*
            Save JWT
            */

            localStorage.setItem(
                "apexAccessToken",
                data.accessToken
            );


            /*
            Optional user data
            */

            if(data.user){

                localStorage.setItem(
                    "apexUser",
                    JSON.stringify(
                        data.user
                    )
                );
            }


            /*
            Success
            */

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            /*
            Dashboard redirect
            */

            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Login error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to login.",
                "error"
            );


            /*
            Restore button
            */

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";
        }

    }
);

</script>

</body>
</html>
