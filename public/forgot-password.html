<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Apex Ventures</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(
            circle at top right,
            #173c2c,
            transparent 42%
        ),
        #050b08;

    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    font-size:31px;
    letter-spacing:1px;
    color:#d7b45a;
}

.brand p{
    margin-top:7px;
    color:#91a69a;
    font-size:14px;
}

.card{
    background:rgba(13,25,20,.96);
    border:1px solid rgba(215,180,90,.18);
    border-radius:22px;
    padding:30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.icon{
    width:58px;
    height:58px;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:rgba(215,180,90,.10);
    border:1px solid rgba(215,180,90,.18);

    color:#d7b45a;
    font-size:25px;
}

h2{
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    color:#899b91;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:#b8c8bf;
    font-size:13px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px 15px;

    border-radius:12px;
    border:1px solid #263a31;

    background:#08120e;
    color:#fff;

    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#d7b45a;

    box-shadow:
        0 0 0 3px
        rgba(215,180,90,.08);
}

input::placeholder{
    color:#53665d;
}

.submit-btn{
    width:100%;
    padding:15px;

    border:none;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #d7b45a,
            #a88635
        );

    color:#08100c;
    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.submit-btn:hover{
    filter:brightness(1.05);
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    padding:12px;
    margin-bottom:16px;

    border-radius:10px;

    font-size:13px;
    line-height:1.4;
}

.message.error{
    display:block;
    color:#ff9b9b;
    background:rgba(180,40,40,.12);
}

.message.success{
    display:block;
    color:#78e0a6;
    background:rgba(40,150,90,.12);
}

.back{
    text-align:center;
    margin-top:22px;
}

.back a{
    color:#d7b45a;
    text-decoration:none;
    font-size:14px;
}

.spinner{
    display:inline-block;

    width:15px;
    height:15px;

    border:2px solid rgba(0,0,0,.25);
    border-top-color:#08100c;

    border-radius:50%;

    animation:spin .7s linear infinite;

    vertical-align:middle;
    margin-right:7px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>APEX VENTURES</h1>
        <p>Secure account recovery</p>
    </div>


    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter the email address associated with
            your Apex Ventures account. We'll send
            instructions to reset your password.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="forgotForm">

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Send Reset Instructions
            </button>

        </form>


        <div class="back">
            <a href="login.html">
                ← Back to Login
            </a>
        </div>

    </div>

</div>


<script>

const API_URL = "";

const form =
    document.getElementById(
        "forgotForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const message =
    document.getElementById(
        "message"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );


function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;
}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }


        submitBtn.disabled =
            true;

        submitBtn.innerHTML =
            `
            <span class="spinner"></span>
            Sending...
            `;


        try{

            const response =
                await fetch(
                    `${API_URL}/api/auth/forgot-password`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email
                            })
                    }
                );


            let data = {};

            try{

                data =
                    await response.json();

            }catch{

                data = {};

            }


            if(!response.ok){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Unable to process request."
                );
            }


            /*
             * For security, the backend should return
             * the same generic success message whether
             * or not the email exists.
             */

            showMessage(
                data.message ||
                "If an account exists for this email, reset instructions have been sent.",
                "success"
            );


            form.reset();


        }catch(error){

            console.error(
                "Forgot password:",
                error
            );

            showMessage(
                error.message ||
                "Unable to process your request.",
                "error"
            );

        }finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Send Reset Instructions";
        }

    }
);

</script>

</body>
  </html>
